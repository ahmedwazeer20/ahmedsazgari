<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog & Travel — ahmedsazgari | Aerial Photography Tips & Travel Logs</title>
  <meta name="description" content="Aerial photography tips, travel drone logs across Europe, and behind-the-scenes stories from ahmedsazgari.">
  <meta name="keywords" content="aerial photography tips, drone travel, travel blog, Europe, Helsinki, drone logs, photography guide">
  <meta name="author" content="ahmedsazgari">
  <meta property="og:title" content="Blog & Travel — ahmedsazgari">
  <meta property="og:description" content="Aerial photography tips, travel drone logs across Europe, and behind-the-scenes stories.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <div id="nav-placeholder"></div>

  <!-- ================= PAGE HEADER ================= -->
  <section class="section" style="padding-bottom: 2rem;">
    <div class="section-container">
      <div class="section-header fade-up">
        <span class="section-tag">Blog & Travel</span>
        <h1 class="section-title">Stories from the Sky</h1>
        <p class="section-subtitle">
          Aerial photography tips, travel drone logs across Europe, and
          behind-the-scenes insights from my latest adventures.
        </p>
      </div>
    </div>
  </section>

  <!-- ================= BLOG GRID ================= -->
  <section class="section" style="padding-top: 1rem;">
    <div class="section-container">
      <div class="blog-grid" id="blog-posts-container"></div>
    </div>
  </section>

  <!-- ================= NEWSLETTER CTA ================= -->
  <section class="section">
    <div class="section-container text-center fade-up">
      <h2 class="section-title">Never Miss a Story</h2>
      <p class="section-subtitle mb-4">
        Subscribe for new articles, travel logs, and exclusive behind-the-scenes content.
      </p>
      <a href="contact.html" class="btn btn-primary">Get in Touch →</a>
    </div>
  </section>

  <!-- ================= FOOTER ================= -->
  <div id="footer-placeholder"></div>

  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://unzlwbmoxturkdsbijqt.supabase.co';
    const supabaseKey = 'sb_publishable_fL2Eyod5AsbBaNfie3Rivw_Q2eJjBBb';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    async function loadBlogPosts() {
      const { data: posts, error } = await supabaseClient
        .from('blog')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching blog posts:', error);
        return;
      }

      const container = document.getElementById('blog-posts-container');
      if (!container) return;
      container.innerHTML = '';

      if (!posts || posts.length === 0) {
        container.innerHTML = `<p class="text-center col-span-full py-8" style="color: var(--text-muted);">No blog articles published yet.</p>`;
        return;
      }

      // Inject JSON-LD Schema for Search & AI Crawlers (SEO / GEO / AEO)
      const schemaData = {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "ahmedsazgari Aerial Drone Blog",
        "url": "https://ahmedsazgari.vercel.app/blog.html",
        "blogPost": posts.map(post => ({
          "@type": "BlogPosting",
          "headline": post.title,
          "description": post.excerpt,
          "image": post.image_url,
          "author": {
            "@type": "Person",
            "name": post.author || "ahmedsazgari"
          },
          "datePublished": post.created_at,
          "mainEntityOfPage": `https://ahmedsazgari.vercel.app/blog-post.html?slug=${post.slug || post.id}`
        }))
      };

      const scriptSchema = document.createElement('script');
      scriptSchema.type = 'application/ld+json';
      scriptSchema.text = JSON.stringify(schemaData);
      document.head.appendChild(scriptSchema);

      // Render dynamic HTML cards matching your existing CSS
      posts.forEach(post => {
        const formattedDate = new Date(post.created_at).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });

        const altText = post.image_alt || `${post.title} - ahmedsazgari drone photography Helsinki`;
        const imageElement = post.image_url 
          ? `<img src="${post.image_url}" alt="${altText}" loading="lazy" class="w-full h-48 object-cover rounded-t-lg" />`
          : `<div class="w-full h-48 flex items-center justify-center rounded-t-lg" style="background: var(--glass-panel-bg); color: var(--text-muted);">Aerial Article</div>`;

        const postUrl = post.slug ? `blog-post.html?slug=${post.slug}` : `blog-post.html?id=${post.id}`;

        const card = `
          <article class="blog-card fade-up visible" itemscope itemtype="https://schema.org/BlogPosting">
            <a href="${postUrl}">
              ${imageElement}
            </a>
            <div class="blog-body">
              <div class="blog-meta">
                <span class="tag">${post.category || 'Drone Media'}</span>
                <span>·</span>
                <time datetime="${post.created_at}">${formattedDate}</time>
              </div>
              <h3 itemprop="headline">
                <a href="${postUrl}">${post.title}</a>
              </h3>
              <p itemprop="description">${post.excerpt || ''}</p>
              <a href="${postUrl}" class="blog-link">Read Article →</a>
            </div>
          </article>
        `;

        container.innerHTML += card;
      });
    }

    loadBlogPosts();
  </script>
  <script>
    Promise.all([
      fetch('nav.html').then(res => res.text()),
      fetch('footer.html').then(res => res.text())
    ]).then(([navHtml, footerHtml]) => {
      document.getElementById('nav-placeholder').innerHTML = navHtml;
      document.getElementById('footer-placeholder').innerHTML = footerHtml;
      initHeader();
      initHamburger();
      initActiveLinks();
    });
  </script>
</body>
</html>
